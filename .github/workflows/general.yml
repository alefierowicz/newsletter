name: Rust
on: [push, pull_request]

env:
    CARGO_TERM_COLOR: always
    SQLX_VERSION: 0.9.0
    SQLX_FEATURES: "rustls,postgres"
    APP_USER: app
    APP_USER_PWD: secret
    APP_DB_NAME: newsletter

jobs:
    test:
        name: test
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:latest
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            
            - name: cache sqlx-cli binary
              id: cache-sqlx
              uses: actions/cache@v4
              with:
                path: |
                  ~/.cargo/bin/sqlx
                  ~/.cargo/bin/cargo-sqlx
                key: ${{ runner.os }}-sqlx-cli-${{ env.SQLX_VERSION }}
                save-always: true

            - name: install sqlx
              if: steps.cache-sqlx.outputs.cache-hit != 'true'
              run: cargo install sqlx-cli --version=${{env.SQLX_VERSION}} --features ${{env.SQLX_FEATURES}} --no-default-features --locked
            
            - name: create the user in postgres
              run: |
                sudo apt install postgresql-client
                CREATE_QUERY="CREATE USER ${APP_USER} WITH PASSWORD '${APP_USER_PWD}';"
                PGPASSWORD="password" psql -U "postgres" -h "localhost" -c "${CREATE_QUERY}"
            
            - name: grant privileges
              run: |
                GRANT_QUERY="ALTER USER ${APP_USER} CREATEDB;"
                PGPASSWORD="password" psql -U "postgres" -h "localhost" -c "${GRANT_QUERY}"
            - name: migrate
              run: SKIP_DOCKER=true ./scripts/init_db.sh

            - name: run tests
              run: cargo test

            - name: prepare queries for sqlx cache
              run: cargo sqlx prepare --workspace --check -- --all-targets
            
    fmt:
        name: rustfmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                components: rustfmt
            - name: enforce proper format
              run: cargo fmt --check

    clippy:
        name: clippy
        runs-on: ubuntu-latest
        env:
            SQLX_OFFLINE: true
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                components: clippy
            - name: linting
              run: cargo clippy -- -D warnings