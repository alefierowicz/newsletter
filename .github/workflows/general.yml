name: Rust
on: [push, pull_request]

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - name: run tests
              run: cargo test
    fmt:
        name: rustfmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                components: rustfmt
            - name: enforce proper format
              run: cargo fmt --check

    clippy:
        name: clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                components: clippy
            - name: linting
              run: cargo clippy -- -D warnings